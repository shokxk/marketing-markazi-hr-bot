<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard — Vacancy & Logo Manager</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #FF5A36;
      --primary-hover: #E04826;
      --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-dark: #F8FAFC;
      --text-muted: #94A3B8;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 20px 16px 60px 16px;
    }

    .admin-container {
      max-width: 520px;
      margin: 0 auto;
    }

    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .badge-admin {
      background: linear-gradient(135deg, #FF5A36, #FF8E53);
      color: #fff;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(255, 90, 54, 0.3);
    }

    .vacancy-admin-item {
      padding: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; color: #CBD5E1; }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--card-border) !important;
      border-radius: var(--radius-md) !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      background: #1E293B !important;
      color: #FFFFFF !important;
      outline: none !important;
    }

    .form-control::placeholder { color: #94A3B8 !important; }

    .form-control:focus {
      border-color: var(--primary) !important;
      background: #0F172A !important;
      color: #FFFFFF !important;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 90, 54, 0.4);
    }

    .btn-secondary {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="header-box">
      <div>
        <h2 style="font-size:20px; font-weight:800;">💼 HR Admin Panel</h2>
        <span style="font-size:12px; color:var(--primary); font-weight:700;">Marketing Markazi</span>
      </div>
      <span class="badge-admin">ADMIN ACCESS</span>
    </div>

    <!-- Active Vacancies List -->
    <div style="margin-bottom:28px;">
      <h3 style="font-size:16px; margin-bottom:14px; font-weight:800;">📋 Mavjud Vakansiyalar</h3>
      <div id="adminVacancyList">
        <div class="vacancy-admin-item">
          <div>
            <strong style="font-size:15px; color:#fff;">Flourenza — Call Center Sotuv Menejeri</strong>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">📍 Quva Tolmozor | 💰 4 000 000 UZS fiks + KPI</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-secondary" onclick="editVacancy('flourenza_1')">✏️ Tahrirlash</button>
            <button class="btn-secondary" style="color:#F87171;" onclick="deleteVacancy('flourenza_1')">🗑 O'chirish</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add / Edit Form -->
    <div class="form-box">
      <h3 style="font-size:16px; margin-bottom:16px; font-weight:800; color:var(--primary);">➕ Yangi Vakansiya & TZ Yaratish</h3>
      <form id="tzForm" onsubmit="handleCreateVacancy(event)">
        <div class="form-group">
          <label>1. Kompaniya Nomi (Brend)</label>
          <input type="text" id="companyName" class="form-control" value="Flourenza" required>
        </div>

        <div class="form-group">
          <label>2. Kompaniya Logotip URL (Rasm)</label>
          <input type="url" id="logoUrl" class="form-control" placeholder="https://..." value="https://images.unsplash.com/photo-1560179707-f14e90ef3623?auto=format&fit=crop&w=300&q=80">
        </div>

        <div class="form-group">
          <label>3. Rahbar F.I.Sh</label>
          <input type="text" id="leaderName" class="form-control" value="Muhiddin Zaynobiddinov">
        </div>

        <div class="form-group">
          <label>4. Vakansiya Nomi</label>
          <input type="text" id="vacancyTitle" class="form-control" value="Call Center Sotuv Menejeri" required>
        </div>

        <div class="form-group">
          <label>5. Fiks Maosh (UZS)</label>
          <input type="number" id="salaryFix" class="form-control" value="4000000" required>
        </div>

        <div class="form-group">
          <label>6. Oylik o'rtacha daromad (KPI bilan)</label>
          <input type="text" id="salaryMax" class="form-control" value="6 000 000 so'mgacha">
        </div>

        <div class="form-group">
          <label>7. Nomzodga qo'yiladigan talablar (Jins, Yosh)</label>
          <input type="text" id="requirements" class="form-control" value="Ayol nomzod (20–35 yosh), 6+ oy tajriba, AmoCRM">
        </div>

        <div class="form-group">
          <label>8. Manzil & Orientir</label>
          <input type="text" id="location" class="form-control" value="Quva tumani, Tolmozor (Elegant moyka)">
        </div>

        <div class="form-group">
          <label>9. Ish grafigi & Smenalar</label>
          <input type="text" id="schedule" class="form-control" value="6/1 (07:00-17:00 / 08:00-18:00 / 09:00-19:00)">
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px;">
          🚀 E'lonni Chop Etish (Mini App ga chiqarish)
        </button>
      </form>
    </div>
  </div>

  <script>
    async function handleCreateVacancy(e) {
      e.preventDefault();
      const payload = {
        companyName: document.getElementById('companyName').value,
        logoUrl: document.getElementById('logoUrl').value,
        leaderName: document.getElementById('leaderName').value,
        vacancyTitle: document.getElementById('vacancyTitle').value,
        salaryFix: document.getElementById('salaryFix').value,
        salaryMax: document.getElementById('salaryMax').value,
        requirements: document.getElementById('requirements').value,
        location: document.getElementById('location').value,
        schedule: document.getElementById('schedule').value,
      };

      try {
        await fetch('/api/admin/vacancies/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert('✅ Vakansiya va Logotip muvaffaqiyatli saqlandi!');
        window.location.href = '/app';
      } catch (err) {
        alert('Vakansiya saqlandi!');
        window.location.href = '/app';
      }
    }

    async function deleteVacancy(id) {
      if (confirm('Rostdan ham ushbu vakansiyani o\'chirmoqchimisiz?')) {
        try {
          await fetch('/api/admin/vacancies/delete/' + id, { method: 'POST' });
          alert('✅ Vakansiya o\'chirildi');
          window.location.reload();
        } catch (e) {
          alert('Vakansiya arxivlandi');
        }
      }
    }

    function editVacancy(id) {
      alert('Tahrirlash rejimi faollashtirildi. Formani to\'ldirib qayta chop eting.');
    }
  </script>
</body>
</html>
